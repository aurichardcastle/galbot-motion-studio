[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "galbot-motion-studio"
version = "0.1.0"
description = "Simulation-first webcam motion studio for the Galbot G1"
authors = [{ name = "Auric Hardcastle" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "mujoco>=3.2,<4",
  "numpy>=2,<3",
  "opencv-python>=4.10,<5",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2,<3",
]

[project.scripts]
galbot-motion-studio = "galbot_motion_studio.cli:main"

[project.optional-dependencies]
vision = ["mediapipe>=0.10,<1"]
export-validation = ["lerobot>=0.3.3,<0.4"]
# Strict-priority arm IK. Optional so the base install, the simulation-only
# boundary test and the wrist-primary mapper stay free of it.
#
# LICENCE NOTE, deliberately recorded here rather than buried: mink is
# Apache-2.0 and daqp is MIT, but mink pulls qpsolvers, which is LGPL-3.0.
# LGPL on an imported, unmodified library permits commercial use and does not
# reach our own source, but it is copyleft sitting in the dependency tree and
# is a decision the engagement should make knowingly, not inherit by accident.
swivel = ["mink>=1.2,<2"]
# macOS only. Lets the capture resolve the built-in camera by DEVICE TYPE rather
# than by index. Without it a Continuity Camera entering the device list shifts
# every index below it, so "camera 0" silently becomes the operator's phone.
camera-select = ["pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'"]
dev = ["pytest>=8,<10", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/galbot_motion_studio"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/galbot_one_golf_description" = "galbot_motion_studio/_assets/galbot_one_golf_description"
"assets/mediapipe" = "galbot_motion_studio/_assets/mediapipe"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
